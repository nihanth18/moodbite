# MoodBite rule-based ranking config (Phase 1).
#
# Mood signals available to conditions:
#   valence, arousal        in [-1, 1] (from HSEmotion)
#   stress                  = angry + fear + disgust  (probability mass, 0..1)
#   happy, sad, neutral, surprise, angry, fear, disgust   (probabilities, 0..1)
#
# Condition keys: <signal>_above / <signal>_below. All conditions in a rule must hold.
# Weights apply to restaurant tags/features:
#   comfort_food, quick_service, lively, quiet, dessert, familiar  (0/1 tags)
#   rating (0..1, review-count-adjusted rating mapped from 3.5..5.0), closeness (1 = right here,
#   0 = at max distance)
#
# Only open places rated 4.0+ with 30+ reviews reach the ranker (see places.py).
# Rating carries the largest base weight, so mood picks among the best-rated places.

detection:
  min_face_confidence: 0.6      # MediaPipe detection score below this -> "low confidence"
  min_emotion_confidence: 0.30  # top emotion probability below this -> treat mood as uncertain

# Always applied, regardless of mood.
base_weights:
  rating: 2.0
  closeness: 0.6

rules:
  - name: low_energy
    when: {arousal_below: -0.1}
    weights: {comfort_food: 1.2, quick_service: 0.8, quiet: 0.3}
    why: "You look a bit low on energy, so here's something comforting and quick"

  - name: upbeat
    when: {valence_above: 0.3, arousal_above: 0.2}
    weights: {lively: 1.3, familiar: -0.2}
    why: "You're in a great mood, so here's somewhere lively"

  - name: content_calm
    when: {valence_above: 0.2, arousal_below: 0.2}
    weights: {quiet: 0.8, rating: 0.4}
    why: "You seem relaxed, so here's a calm, well-rated spot"

  - name: stressed
    when: {stress_above: 0.35}
    weights: {dessert: 1.2, familiar: 0.9, quiet: 0.5, lively: -0.4}
    why: "You look a little stressed, so here's a familiar spot with a sweet treat"

  - name: down
    when: {sad_above: 0.35}
    weights: {comfort_food: 1.3, dessert: 0.7}
    why: "Looks like a comfort-food kind of moment"

  - name: surprised_curious
    when: {surprise_above: 0.4}
    weights: {familiar: -0.6, lively: 0.4}
    why: "You look curious, so here's something a little different"

# Fallback reason when no mood rule fires.
default_why: "One of the best-rated places open near you"

bandit:
  min_events: 20   # below this many feedback events, use rules only
  alpha: 0.6       # LinUCB exploration strength
  ridge: 1.0       # L2 regularisation (A = ridge * I initially)
